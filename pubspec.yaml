name: solo_leveling_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  table_calendar: ^3.1.2  
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.6.0
  url_launcher: ^6.2.5
  http: ^1.2.0
  flutter_background_service: ^5.1.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  file_picker: ^11.0.3
  archive: ^4.3.0
dependency_overrides:
  path_provider_foundation: 2.4.0
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/